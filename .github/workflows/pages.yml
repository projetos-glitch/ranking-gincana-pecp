name: Atualizar e publicar ranking

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar dados do ranking
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTN6YMI0r8MAfC3l8jYLY05shv9L-ZFTkCSyq3GL6wCUNlBVpZBjAFNuCyfjQbN-wAjs7nWRoPMH433/pub?gid=1035928882&single=true&output=csv"
          request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})

          with urllib.request.urlopen(request, timeout=30) as response:
              text = response.read().decode("utf-8-sig")

          rows = list(csv.reader(io.StringIO(text)))

          def pt_number(value):
              value = (value or "").strip()
              if not value:
                  return 0.0
              value = value.replace(".", "").replace(",", ".")
              return float(value)

          ranking = []
          for row in rows[1:]:
              if len(row) < 3:
                  continue
              turma = row[0].strip()
              if not turma:
                  continue
              ranking.append({
                  "turma": turma,
                  "kg": pt_number(row[1]),
                  "pontos": pt_number(row[2]),
              })

          ranking.sort(key=lambda item: (-item["pontos"], -item["kg"], item["turma"]))

          if not ranking:
              raise SystemExit("Ranking Publico retornou sem turmas.")

          payload = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "source": "Ranking Publico",
              "ranking": ranking,
          }

          with open("ranking.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
